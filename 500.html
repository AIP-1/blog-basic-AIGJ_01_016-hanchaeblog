<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대문이 잠시 고장 났어요 · 한채</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/hanchae.css">
</head>
<body>
  <header class="hc-header">
    <div class="hc-header-inner">
      <a class="hc-logo" href="/">한채</a>
    </div>
  </header>
  <div class="giwa" aria-hidden="true"></div>
  <div class="dancheong-band" aria-hidden="true"></div>

  <main class="lost">
    <div class="lost-gate" aria-hidden="true">
      <div class="lost-roof"><i class="lost-roof-peak"></i><i class="lost-roof-eaves"></i><i class="lost-roof-tip lost-roof-tip-l"></i><i class="lost-roof-tip lost-roof-tip-r"></i></div>
      <div class="dancheong-band"></div>
      <div class="lost-frame">
        <span class="hyeonpan lost-code">500</span>
        <div class="lost-doors"><span><i class="lost-ring"></i></span><span><i class="lost-ring"></i></span></div>
      </div>
      <div class="lost-step"></div>
    </div>
    <div class="lost-text">
      <span class="lost-eyebrow">잠시 문제가 생겼어요</span>
      <h1>대문이 잠시 고장 났어요</h1>
      <p>서버에 문제가 생겨 화면을 열지 못했어요. 잠시 뒤 다시 들어와 주세요.</p>
      <div class="lost-actions">
        <a class="btn btn-primary" href="/">마을로 돌아가기</a>
        <button type="button" class="btn btn-secondary" onclick="location.reload()">다시 불러오기</button>
      </div>
    </div>
  </main>

  <footer class="hc-footer">
    <div class="dancheong-band" aria-hidden="true"></div>
    <div class="hc-footer-inner">
      <span class="hc-footer-logo">한채</span>
      <span class="hc-footer-sub">한 사람, 한 채, 그 안의 기록</span>
    </div>
  </footer>
</body>
</html>
