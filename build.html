<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한채 · 한채 짓기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/hanchae.css">
  <link rel="stylesheet" href="css/pages/build.css">
</head>
<body>
  <header class="hc-header">
    <div class="hc-header-inner">
      <a class="hc-logo" href="/">한채</a>
      <span class="build-crumb">한채 짓기</span>
    </div>
  </header>
  <div class="giwa" aria-hidden="true"></div>
  <div class="dancheong-band" aria-hidden="true"></div>

  <main class="build" id="build" hidden>
    <form class="build-form card" id="build-form" novalidate>
      <div class="build-intro">
        <h1>나의 한채를 지어요</h1>
        <p>한 사람이 한 채를 가질 수 있어요. 세 가지만 정하면 바로 지어져요.</p>
      </div>

      <div class="build-step">
        <label for="address" class="step-label"><span class="step-no" aria-hidden="true">1</span>한채 주소</label>
        <div class="address-box">
          <input id="address" name="address" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32" aria-describedby="address-status address-rule">
        </div>
        <span class="address-status" id="address-status" aria-live="polite"></span>
        <span class="step-hint" id="address-rule">영문 소문자 · 숫자 · 하이픈, 4~32자</span>
        <div class="build-warning">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5v.5"/></svg>
          <span><strong>주소는 지은 뒤 바꿀 수 없어요.</strong> 한채 이름은 나중에 언제든 바꿀 수 있어요.</span>
        </div>
      </div>

      <div class="build-step">
        <label for="name" class="step-label"><span class="step-no" aria-hidden="true">2</span>한채 이름 (현판)</label>
        <input id="name" name="name" class="input build-input" type="text" maxlength="40" autocomplete="off">
        <span class="step-hint">1~40자</span>
      </div>

      <div class="build-step">
        <label for="intro" class="step-label"><span class="step-no" aria-hidden="true">3</span>주인 소개 <span class="optional">(선택)</span></label>
        <textarea id="intro" name="intro" class="textarea" rows="3" maxlength="200"></textarea>
        <span class="step-hint step-count" id="intro-count">0 / 200</span>
      </div>

      <p class="form-error" id="form-error" role="alert"></p>
      <button type="submit" class="btn btn-primary build-submit" id="build-submit">한채 짓기</button>
    </form>

    <section class="preview" aria-labelledby="preview-title">
      <div class="preview-head">
        <h2 id="preview-title">대문 미리보기</h2>
        <span>입력하는 대로 바뀌어요</span>
      </div>
      <div class="preview-gate card">
        <div class="giwa preview-giwa" aria-hidden="true"></div>
        <div class="dancheong-band" aria-hidden="true"></div>
        <div class="preview-body">
          <div class="hyeonpan hyeonpan-lg preview-name" id="preview-name"></div>
          <div class="preview-owner">
            <div class="owner-avatar preview-avatar" aria-hidden="true"></div>
            <span><span id="preview-nickname"></span><br><span id="preview-intro"></span></span>
          </div>
        </div>
        <div class="preview-yard" aria-hidden="true">
          <div class="pillar"></div>
          <div class="preview-yard-floor">아직 마당이 비어 있어요</div>
          <div class="pillar"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/content.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/build.js"></script>
</body>
</html>
